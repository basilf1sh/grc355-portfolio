<link href="https://fonts.googleapis.com/css2?family=Kedebideri:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
	body {
		background: #F8AD9D;
	} #portfolio {
		width: 800px;
		height: 400px;
		border: 1px dashed white;
		margin: 24px auto;
		display: flex;
		flex-wrap: wrap;
		justify-content: space-evenly;
		align-items: flex-start;
		background: #FFDAB9;
	}  h1 {
		font: 48pt/1.4em 'Kedebideri';
		font-weight: bold;
		text-align: center;
		color: white;
	} img {
		width: 200px;
		height: auto;
		//margin: 24px 12px;
	} figure {
		 background: #F4978E;
		margin: 24px 12px;
		width: 200px;
	} figcaption {
		font: italic 13pt/1.4em 'Kedebideri';
		text-weight: Bold;
		text-align: center;
		color: white;
	
	} table {
		margin: 24px auto;
		font: 14pt/1.4em 'Kedebideri';
		border: 1px solid white;
		padding: 12px;
		border-collapse: collapse;
		color: white;
	} td, th {
		padding: 6px 18px;
	} tr:nth-child(odd) {
		background: #F08080;
	} tr:nth-child(even) {
		background: #F4978E;
	} ul {
		width: 800px;
		height: auto;
		//background: #FFDAB9;
		margin: 24px auto;
		display: grid;
		grid-template: auto / repeat(3,auto);
		font: 14pt/2.5em 'Kedebideri';
		text-weight: Bold;
		text-align: center;
	} li {
		list-style: none;
		background: #F08080;
	} a {
		text-decoration: none;
		color: white;
	} a li:hover {
		background: #FBC4AB;
	}
</style>
</head>
