<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Catherine Falls :: Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kedebideri:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
	body {
		background: #F8AD9D;
	} #portfolio {
		width: 800px;
		height: 400px;
		// border: 1px dashed gray;
		margin: 24px auto;
		display: grid;
		grid-template: auto / repeat(3,auto);
	} h1 {
		font: 48pt/1.4em 'Kedebideri';
		font-weight: bold;
		text-align: center;
		color: white;
	} img {
		width: 200px;
		height: auto;
		// margin: 24px 12px;
	} figure {
		// background: pink;
		margin: 24px 12px;
		width: 200px;
	} figcaption {
		font: italic 12pt/1.4em 'Kedebideri';
		text-align: center;
	} table {
		margin: 24px auto;
		font: 14pt/1.4em 'Kedebideri';
		border: 1px black;
		padding: 12px;
		border-collapse: collapse;
	} td, th {
		padding: 6px 18px;
	} tr:nth-child(odd) {
		background: rgba(255,255,255,1.00);
	} form {
		background: #FFDAB9;
		width: 600px;
		height: auto;
		//border: 1px solid gray;
		margin: 24px auto;
		font: 14pt/1.4em 'Kedebideri';
		font-weight: Medium;
		padding: 24px;
		border-radius: 12px;
		box-shadow: 2px 3px 6px #F08080;
	} input[type="text"] {
		width: 98%;
		font: 12pt/1.4em 'Kedebideri';
		margin-top: 12px;
	} textarea {
		width: 98%;
		height: 76px;
		font: 12pt/1.4em 'Kedebideri';
	} input[type="submit"] {
		width: 100px;
		height: 40px;
		background: #F08080;
		border-radius: 6px;
		border: 1px #F08080;
		display: block;
		margin: 24px auto;
		font: 12pt/1.4em 'Kedebideri';
		font-weight: bold;
		font-size: 12pt;
		color: white;
	} ul {
		width: 800px;
		height: auto;
		//background: #FFDAB9;
		margin: 24px auto;
		display: grid;
		grid-template: auto / repeat(3,auto);
		font: 14pt/2.5em 'Kedebideri';
		text-weight: Bold;
		text-align: center;
	} li {
		list-style: none;
		background: #F08080;
	} a {
		text-decoration: none;
		color: white;
	} a li:hover {
		background: #FBC4AB;
	}
</style>
</head>

<body>
	<ul>
		<a href="index.html">
		<li>Flex Portfolio</li>
		</a>
		<a href="grid.html">
		<li>Grid Portfolio</li>
		</a>
		<a href="form.html">
		<li>Contact Me</li>
		</a>
	</ul>
	<h1>Contact Me</h1>
	<form action="https://formsubmit.co/fallsc1@unlv.nevada.edu" method="POST">
		<input type="text" /><br/>
		<label>First name</label><br/>
		<input type="text" /><br/>
		<label>Last name</label><br/>
		<input type="text" /><br/>
		<label>Email</label><br/><br/>
		<label>Message</label><br/>
		<textarea></textarea>
		<input type="Submit" />
	</form>
</body>
</html>
